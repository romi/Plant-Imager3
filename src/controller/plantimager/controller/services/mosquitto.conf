# Mosquitto broker config for the Plant-Imager controller Pi.
#
# Deploy to /etc/mosquitto/conf.d/plant-imager.conf via the
# plant-imager-controller-setup entry-point (see plan "Combined picamera control").
#
# Security model (locked 2026-10-13): no authentication. The broker only
# listens on the isolated USB gadget bridge (br-usb0, 10.10.11.0/24, cameras
# only) and localhost, so it is unreachable from any other network.
# Extra hardening, if ever needed, belongs at the firewall, not here.

listener 1883 10.10.11.1
listener 1883 127.0.0.1
allow_anonymous true
persistence false
