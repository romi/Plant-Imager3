# GitHub workflow that runs the unit tests on every merge request.

name: Unit tests

on:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libpulse0

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install src/commons/ src/controller/ src/webui/
          pip install pytest pytest-qt freezegun objgraph

      - name: Run unit tests
        run: python -m unittest discover -s test/unit -v

      - name: Run pytest unit tests
        run: python -m pytest test/unit -q
