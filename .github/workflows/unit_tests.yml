# GitHub workflow that runs the unit tests on every merge request.

name: Unit tests

on:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install src/commons/ src/controller/ src/webui/

      - name: Run unit tests
        run: python -m unittest discover -s test/unit -v
